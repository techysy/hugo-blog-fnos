{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ range .Pages }}
<article class="post">
  <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
  <div class="meta">{{ .Date.Format "2006-01-02" }}</div>
  {{ with .Summary }}<p>{{ . }}</p>{{ end }}
</article>
{{ else }}
<p>暂无文章。在 content/post/ 目录添加 markdown 文章，Hugo 会自动渲染。</p>
{{ end }}
{{ end }}
